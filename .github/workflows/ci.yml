name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway credentials for a CI-only database container.
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: taskqueue_test
          MYSQL_USER: taskqueue
          MYSQL_PASSWORD: ci-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=3s --health-timeout=3s --health-retries=40
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: taskqueue_test
      MYSQL_USER: taskqueue
      MYSQL_PASSWORD: ci-password
      REDIS_URL: redis://localhost:6379/15
      KEY_PREFIX: "tqtest:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and integration tests (skips count as failures)
        run: |
          set -o pipefail
          pytest -v -rs | tee pytest.txt
          ! grep -q "SKIPPED" pytest.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: taskqueue:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: taskqueue-test:${{ github.sha }}
          cache-from: type=gha

  e2e:
    # Boots the full Compose stack and runs the failure drills: kill a worker
    # mid-job, restart Redis, restart MySQL, poison job through the DLQ.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway CI secrets
        run: |
          cp .env.example .env
          sed -i "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300 api worker scheduler
      - name: Failure drills
        run: python3 scripts/chaos_test.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

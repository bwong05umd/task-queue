# Production overrides for a single VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# scripts/deploy.sh runs this for you. Secrets come from .env on the VM
# (generated there on first deploy, never committed). Set API_KEY in it to
# require an X-API-Key header on every job endpoint.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    ports: !override
      - "80:8000"
    environment:
      API_WORKERS: ${API_WORKERS:-2}
    logging: *logging
    restart: always

  worker:
    deploy:
      replicas: 2
    logging: *logging
    restart: always

  scheduler:
    logging: *logging
    restart: always

  mysql:
    logging: *logging
    restart: always

  redis:
    logging: *logging
    restart: always

  # Dashboards stay on localhost; reach them with an SSH tunnel:
  #   ssh -L 3000:localhost:3000 -L 9090:localhost:9090 user@vm
  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
    restart: always

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    restart: always

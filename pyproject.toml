[project]
name = "taskqueue"
version = "0.1.0"
description = "A small distributed task queue: FastAPI + Redis + MySQL"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: needs real Redis and MySQL (run via docker compose)"]
